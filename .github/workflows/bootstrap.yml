name: Fix repository layout
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move project to repository root
        run: |
          set -euo pipefail
          cp -a horoscopetools-automation-repo/. .
          mkdir -p .github/workflows
          echo '' | base64 -d > .github/workflows/daily-deploy.yml
          echo 'YnVpbGQvCm5vZGVfbW9kdWxlcy8KX19weWNhY2hlX18vCioucHljCi5EU19TdG9yZQo=' | base64 -d > .gitignore
          rm -rf horoscopetools-automation-repo
          rm .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move automation project to repository root'
          git push
