<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">Sun and Moon calculator input map</title><desc id="desc">A diagram showing date boundary checks for Sun results and local time checks for Moon results.</desc><rect width="960" height="380" rx="24" fill="#152130"/><text x="58" y="68" fill="#f3f1e8" font-family="Georgia,serif" font-size="34">Two results, two input checks</text><g font-family="Arial,sans-serif"><rect x="58" y="112" width="386" height="186" rx="16" fill="#f0c75e"/><text x="90" y="162" fill="#162234" font-size="22" font-weight="700">SUN SIGN</text><text x="90" y="205" fill="#162234" font-size="17">Check the calendar date first.</text><text x="90" y="235" fill="#162234" font-size="17">Near a sign change, preserve the</text><text x="90" y="262" fill="#162234" font-size="17">recorded local date and time zone.</text><rect x="516" y="112" width="386" height="186" rx="16" fill="#9fc9ca"/><text x="548" y="162" fill="#162234" font-size="22" font-weight="700">MOON SIGN</text><text x="548" y="205" fill="#162234" font-size="17">Check date, local time and city.</text><text x="548" y="235" fill="#162234" font-size="17">A missing or rounded time can change</text><text x="548" y="262" fill="#162234" font-size="17">what a calculator displays near a boundary.</text></g><text x="58" y="340" fill="#c6cfdd" font-family="Arial,sans-serif" font-size="16">Record the displayed setting before comparing results across calculators.</text></svg>
