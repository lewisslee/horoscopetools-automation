<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Birth chart input map</title><desc id="desc">Date, time and place each support a different part of a birth chart calculation.</desc><rect width="960" height="390" rx="26" fill="#101c2e"/><text x="54" y="68" fill="#efcf8b" font-family="Georgia,serif" font-size="33">One chart, three inputs</text><text x="54" y="104" fill="#c2c9d5" font-family="system-ui" font-size="18">Keep each conclusion connected to the data that makes it possible.</text><g font-family="system-ui"><rect x="54" y="150" width="250" height="166" rx="18" fill="#193249" stroke="#efcf8b"/><text x="80" y="196" fill="#efcf8b" font-size="22">DATE</text><text x="80" y="235" fill="#f4f0e9" font-size="18">Planet positions</text><text x="80" y="267" fill="#c2c9d5" font-size="16">Sun-sign range</text><rect x="355" y="150" width="250" height="166" rx="18" fill="#1d2444" stroke="#aaa0ef"/><text x="381" y="196" fill="#efcf8b" font-size="22">TIME</text><text x="381" y="235" fill="#f4f0e9" font-size="18">Ascendant</text><text x="381" y="267" fill="#c2c9d5" font-size="16">House rotation</text><rect x="656" y="150" width="250" height="166" rx="18" fill="#18363b" stroke="#9fc9ca"/><text x="682" y="196" fill="#efcf8b" font-size="22">PLACE</text><text x="682" y="235" fill="#f4f0e9" font-size="18">Local horizon</text><text x="682" y="267" fill="#c2c9d5" font-size="16">Time-zone context</text></g></svg>
