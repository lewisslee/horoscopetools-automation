<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Three-pass star chart reading order</title><desc id="desc">Validate inputs, locate a placement, then limit the claim.</desc>
  <rect width="960" height="330" rx="24" fill="#101b2d"/>
  <text x="58" y="70" fill="#f5f1e9" font-family="Georgia,serif" font-size="34">Read the calculation in three passes</text>
  <g font-family="Arial,sans-serif"><g transform="translate(58 112)"><circle cx="40" cy="48" r="35" fill="#efcf8b"/><text x="32" y="60" fill="#101b2d" font-size="28">1</text><text x="96" y="40" fill="#efcf8b" font-size="20" font-weight="700">VALIDATE</text><text x="96" y="70" fill="#c2c9d5" font-size="16">Date · time · place · settings</text></g><path d="M330 160h90" stroke="#52617a" stroke-width="3"/><path d="M408 151l14 9-14 9" fill="none" stroke="#52617a" stroke-width="3"/><g transform="translate(430 112)"><circle cx="40" cy="48" r="35" fill="#9fc9ca"/><text x="32" y="60" fill="#101b2d" font-size="28">2</text><text x="96" y="40" fill="#9fc9ca" font-size="20" font-weight="700">LOCATE</text><text x="96" y="70" fill="#c2c9d5" font-size="16">Planet · sign · degree · house</text></g><path d="M700 160h90" stroke="#52617a" stroke-width="3"/><path d="M778 151l14 9-14 9" fill="none" stroke="#52617a" stroke-width="3"/><g transform="translate(800 112)"><circle cx="40" cy="48" r="35" fill="#d9a6cb"/><text x="96" y="40" fill="#d9a6cb" font-size="20" font-weight="700">3</text><text x="96" y="70" fill="#c2c9d5" font-size="16">Claim only what the data supports</text></g></g>
  <text x="58" y="278" fill="#c2c9d5" font-family="Arial,sans-serif" font-size="16">If a time is unknown, angles and houses remain unresolved.</text>
</svg>
